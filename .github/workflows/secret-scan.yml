name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # every commit, not just the latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan all of git history for keys, personal data and recordings
        run: python tools/scan_history.py
