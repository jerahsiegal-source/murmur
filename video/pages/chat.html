<!doctype html><meta charset="utf-8"><title>Team chat</title>
<style>
 html,body{margin:0;height:100%;font-family:"Segoe UI Variable","Segoe UI",sans-serif;background:#1e2430;color:#e8ecf2}
 body{display:flex;flex-direction:column}
 .top{padding:14px 26px;font-size:19px;font-weight:600;border-bottom:1px solid #323a4a}
 .msgs{flex:1;padding:20px 26px;display:flex;flex-direction:column;gap:14px;justify-content:flex-end}
 .m{max-width:70%;background:#2b3344;border-radius:14px;padding:11px 16px;font-size:19px;line-height:1.4}
 .m b{display:block;font-size:14px;color:#9fb0c8;margin-bottom:3px}
 .in{margin:0 26px 24px;background:#2b3344;border:1px solid #46526a;border-radius:14px;padding:6px 10px}
 textarea{display:block;width:100%;box-sizing:border-box;height:112px;border:0;outline:0;resize:none;background:transparent;
   padding:10px 8px;font:22px/1.45 "Segoe UI Variable","Segoe UI",sans-serif;color:#fff}
 textarea::placeholder{color:#7f8ba0}
</style>
<div class="top"># launch</div>
<div class="msgs">
 <div class="m"><b>Priya</b>Onboarding screens are ready for a look.</div>
 <div class="m"><b>Sam</b>Nice. Who's sending the beta invites?</div>
</div>
<div class="in"><textarea id="t" autofocus spellcheck="false" placeholder="Message #launch"></textarea></div>
<script>addEventListener("focus",()=>document.getElementById("t").focus())</script>
